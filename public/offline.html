<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Offline — Nexora</title>
<style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#03040c;color:#eee;font-family:system-ui,sans-serif;text-align:center;padding:24px}button{background:linear-gradient(90deg,#7c3aed,#3b82f6,#22d3ee);color:#fff;border:0;border-radius:8px;padding:10px 20px;font-size:16px}</style></head>
<body><img src="/icon-192.png" width="72" height="72" alt="" /><h1 id="h" style="margin:0;font-size:22px">You're offline</h1><p id="p" style="margin:0;color:#999">Check your connection and try again.</p><button id="b" onclick="location.reload()">Try again</button>
<script>
  // نفس كوكي اللغة الذي يستخدمه الموقع
  if (/(?:^|; )lang=ar/.test(document.cookie)) {
    document.documentElement.lang = "ar"; document.documentElement.dir = "rtl"; document.title = "لا يوجد اتصال — Nexora";
    document.getElementById("h").textContent = "لا يوجد اتصال بالإنترنت";
    document.getElementById("p").textContent = "تحقّق من الاتصال ثم أعد المحاولة.";
    document.getElementById("b").textContent = "إعادة المحاولة";
  }
</script></body>
</html>
